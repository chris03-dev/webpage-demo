services:
  db:
    image: postgres
    env_file:
      - .env.example
    ports:
      - "5432:5432"
    volumes:
      - ./initdb:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data

  server:
    build: ./server
    ports:
      - "3000:3000"
    depends_on:
      - db

  client1:
    build: ./client1
    ports:
      - "5000:5000"

  client2:
    build: ./client2
    ports:
      - "5001:5001"
  
  proxy:
    build: ./proxy
    ports:
      - "8080:80"

volumes:
  postgres-data:
