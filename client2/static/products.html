<!DOCTYPE html>
<html lang='en'>
	<head>
		<title>Manage Products - SportsPro Technical Support</title>
		<meta charset='UTF-8'>
		<meta name='viewport' content='initial-scale=1.0,width=device-width,height=device-height'>
		<link rel='stylesheet' href='theme.css'>
		<script src='script.js' defer></script>
	</head>
	<body>
		<header>
			<h1>SportsPro Technical Support</h1>
			<p>Sports management software for the sports enthusiast</p>
		</header>
		<article>
			<div class='hflex'>
				<h2>Product List</h2>
				<a href='index.html'>Home</a>
			</div>
			
			<div class='vflex'>
				<label for='query'>Code:</label>
				<div class='hflex'>
					<input type='text' id='query' name='query' placeholder='Enter product code' style='flex-grow:1'>
					<button class='action' id='search_query'>Search</button>
				</div>
			</div>
			
			<div>
			<table id='products'>
				<tr>
					<th>Code</th>
					<th>Name</th>
					<th>Version</th>
					<th>Release Date</th>
					<th>Action</th>
				</tr>
			</table>
			</div>
			
			<h3 id='intent'>Add Product</h3>
			<div class='vflex'>
				<label for='code'>Code:</label>
				<input type='text' id='code' name='code' pattern='.{1,10}' required>
				
				<label for='name'>Name:</label>
				<input type='text' id='name' name='name' pattern='.{1,50}' required>
				
				<label for='version'>Version:</label>
				<input type='number' id='version' name='version' step='0.1' min='0.1' pattern='\d{1,20}' required>
				
				<label for='release_date'>Release Date:</label>
				<input type='date' id='release_date' name='release_date' required>
			</div>
			
			<button class='action' id='add_entry' disabled>Add Product</button>
			<button class='action' id='update_entry' hidden>Update Product</button>
			<button id='cancel_update' hidden>Cancel</button>
		</article>
		<footer>
			<p>&copy; 2025 SportsPro, Inc.</p>
		</footer>
	</body>
</html>
