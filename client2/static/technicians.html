<!DOCTYPE html>
<html lang='en'>
	<head>
		<title>Manage Technicians - SportsPro Technical Support</title>
		<meta charset='UTF-8'>
		<meta name='viewport' content='initial-scale=1.0,width=device-width,height=device-height'>
		<link rel='stylesheet' href='theme.css'>
		<script src='script.js' defer></script>
	</head>
	<body>
		<header>
			<h1>SportsPro Technical Support</h1>
			<p>Sports management software for the sports enthusiast</p>
		</header>
		<article>
			<div class='hflex'>
				<h2>Technician List</h2>
				<a href='index.html'>Home</a>
			</div>
			
			<div class='vflex'>
				<label for='query'>Last Name:</label>
				<div class='hflex'>
					<input type='text' id='query' name='query' placeholder='Enter last name' style='flex-grow:1'>
					<button class='action' id='search_query'>Search</button>
				</div>
			</div>
			
			<div>
			<table id='technicians'>
				<tr>
					<th>First Name</th>
					<th>Last Name</th>
					<th>Email</th>
					<th>Phone</th>
					<th>Action</th>
				</tr>
			</table>
			</div>
			
			<h3 id='intent'>Add Technician</h3>
			<div class='vflex'>
				<label for='first_name'>First Name:</label>
				<input type='text' id='first_name' name='first_name' pattern='[A-Za-z ]{1,50}' required>
				
				<label for='last_name'>Last Name:</label>
				<input type='text' id='last_name' name='last_name' pattern='[A-Za-z ]{1,50}' required>
				
				<label for='email'>Email:</label>
				<input type='email' id='email' name='email' pattern='.{3,100}' required>
				
				<label for='phone'>Phone:</label>
				<input type='tel' id='phone' name='phone' placeholder='e.g. 123-456-7890' pattern='[0-9]{3}-[0-9]{3}-[0-9]{4}' required>
				
				<label for='password'>Password:</label>
				<input type='password' id='password' name='password' placeholder='Minimum of 8 characters...' pattern='.{8,56}' required>
			</div>
			
			<button class='action' id='add_entry' disabled>Add Technician</button>
			<button class='action' id='update_entry' disabled hidden>Update Technician</button>
			<button id='cancel_update' hidden>Cancel</button>
		</article>
		<footer>
			<p>&copy; 2025 SportsPro, Inc.</p>
		</footer>
	</body>
</html>
