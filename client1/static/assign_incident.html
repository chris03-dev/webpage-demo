<!DOCTYPE html>
<html lang='en'>
	<head>
		<title>Assign Incident - SportsPro Technical Support</title>
		<meta charset='UTF-8'>
		<meta name='viewport' content='initial-scale=1.0,width=device-width,height=device-height'>
		<link rel='stylesheet' href='theme.css'>
		<script src='script.js' defer></script>
	</head>
	<body>
		<header>
			<h1>SportsPro Technical Support</h1>
			<p>Sports management software for the sports enthusiast</p>
		</header>
		<article>
			<div class='hflex'>
				<h2>Assign Incident</h2>
				<a href='index.html'>Home</a>
			</div>
			
			<div class='vflex'>
				<label for='query'>Title:</label>
				<div class='hflex'>
					<input type='text' id='query' name='query' placeholder='Enter title' style='flex-grow:1'>
					<button class='action' id='search_query'>Search</button>
				</div>
			</div>
			
			<div>
			<table id='incidents'>
				<tr>
					<th>ID</th>
					<th>Customer</th>
					<th>Product</th>
					<th>Date Opened</th>
					<th>Title</th>
					<th>Action</th>
				</tr>
			</table>
			</div>
			
			<h3>Assign to Technician</h3>
			<div class='hflex incident'>
				<div class='vflex'>
					<h4>Incident ID:</h4>
					<h4>Customer:</h4>
					<h4>Product:</h4>
					<h4>Date Opened:</h4>
					<h4>Title:</h4>
					<h4>Description:</h4>
				</div>
				<div class='vflex'>
					<p id='incident_id'></p>
					<p id='customer_id'></p>
					<p id='product_code'></p>
					<p id='date_opened'></p>
					<p id='title'></p>
				</div>
			</div>
			
			<div class='vflex'>
				<div id='description' class='description'></div>
				<label for='technician_id'>Technician:</label>
				<select id='technician_id' name='technician_id' required>
					 <option value="" selected disabled>Select technician...</option>
				</select>
			</div>
			
			<button class='action' id='update_entry' disabled>Assign Incident</button>
			<button id='cancel_update' hidden>Cancel</button>
		</article>
		<footer>
			<p>&copy; 2025 SportsPro, Inc.</p>
		</footer>
	</body>
</html>
