<!DOCTYPE html>
<html lang='en'>
	<head>
		<title>Update Incident - SportsPro Technical Support</title>
		<meta charset='UTF-8'>
		<meta name='viewport' content='initial-scale=1.0,width=device-width,height=device-height'>
		<link rel='stylesheet' href='theme.css'>
		<script src='script.js' defer></script>
	</head>
	<body>
		<header>
			<h1>SportsPro Technical Support</h1>
			<p>Sports management software for the sports enthusiast</p>
		</header>
		<article>
			<div class='hflex'>
				<h2>Update Incident</h2>
				<a href='index.html'>Home</a>
			</div>
			
			<div class='vflex'>
				<label for='query'>Technician:</label>
				<div class='hflex'>
					<select id='query' name='query' style='flex-grow:1'>
						<option value="0" selected>All technicians</option>
					</select>
					<button class='action' id='search_query'>Get Incidents</button>
				</div>
			</div>
			
			<div>
			<table id='incidents'>
				<tr>
					<th>ID</th>
					<th>Customer</th>
					<th>Product</th>
					<th>Date Opened</th>
					<th>Title</th>
					<th>Action</th>
				</tr>
			</table>
			</div>
			
			<h3>Update Incident</h3>
			<div class='hflex incident'>
				<div class='vflex'>
					<h4>Incident ID:</h4>
					<h4>Customer:</h4>
					<h4>Product:</h4>
					<h4>Date Opened:</h4>
					<h4>Title:</h4>
					<h4>Description:</h4>
				</div>
				<div class='vflex'>
					<p id='incident_id'></p>
					<p id='customer_id'></p>
					<p id='product_code'></p>
					<p id='date_opened'></p>
					<p id='title'></p>
				</div>
			</div>
			
			<div class='vflex'>
				<textarea id='description' class='description' required></textarea>
			</div>
			<div>
				<label for='close_incident'>Close incident</label>
				<input type='checkbox' id='close_incident' name='close_incident'></input>
			</div>
			<button class='action' id='update_entry' disabled>Update Incident</button>
			<button id='cancel_update' hidden>Cancel</button>
		</article>
		<footer>
			<p>&copy; 2025 SportsPro, Inc.</p>
		</footer>
	</body>
</html>
