<!DOCTYPE html>
<html lang='en'>
	<head>
		<title>Create Incident - SportsPro Technical Support</title>
		<meta charset='UTF-8'>
		<meta name='viewport' content='initial-scale=1.0,width=device-width,height=device-height'>
		<link rel='stylesheet' href='theme.css'>
		<script src='script.js' defer></script>
	</head>
	<body>
		<header>
			<h1>SportsPro Technical Support</h1>
			<p>Sports management software for the sports enthusiast</p>
		</header>
		<article>
			<div class='hflex'>
				<h2>Create Incident</h2>
				<a href='index.html'>Home</a>
			</div>
			
			<div class='hflex'>
				<div class='vflex' style='flex-grow:1'>
					<label for='customer_id'>Customer:</label>
					<select id='customer_id' name='customer_id' required>
						 <option value="" selected disabled>Select customer...</option>
					</select>
				</div>
				
				<div class='vflex' style='flex-grow:1'>
					<label for='product_code'>Product:</label>
					<select id='product_code' name='product_code' required>
						 <option value="" selected disabled>Select product...</option>
					</select>
				</div>
			</div>
			
			<div class='vflex'>
				<label for='title'>Title:</label>
				<input type='text' id='title' name='title' placeholder='Brief description of the issue' pattern='.{1,50}' required>
				
				<label for='description'>Description:</label>
				<textarea id='description' placeholder='Detailed description of the incident' pattern='.{1}' required></textarea>
			</div>
			
			<button class='action' id='add_entry' disabled>Add Incident</button>
		</article>
		<footer>
			<p>&copy; 2025 SportsPro, Inc.</p>
		</footer>
	</body>
</html>
